name: SquashLineCalling
options:
  bundleIdPrefix: app.crosscourt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5Q27N692DM
    MARKETING_VERSION: "1.0"
    # Date-based so every day's upload outranks the last; bump the trailing
    # digit for a second same-day TestFlight build.
    CURRENT_PROJECT_VERSION: "202607284"
targets:
  SquashLineCalling:
    type: application
    platform: iOS
    # `archive/` is never listed here. The archived stereo/peer sources live at
    # <repo>/archive/stereo/ios/Sources/, outside this `ios/` directory
    # entirely, so they are structurally unreachable from these paths rather
    # than merely excluded — see archive/stereo/README.md.
    sources:
      - path: Sources
      - path: Resources
      - path: Model
        optional: true
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Crosscourt
        # xcodegen writes literal "1"s otherwise; route through the build
        # settings so CURRENT_PROJECT_VERSION bumps reach TestFlight.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: Records rallies and runs the live ball tracker.
        NSMicrophoneUsageDescription: Impact sounds help the analyzer find wall hits.
        # NSBluetoothAlways / NSLocalNetwork / NSBonjourServices were declared
        # for the archived two-phone peer link. Removed with it: an unused
        # permission string is an App Review question with no answer, and
        # NSBonjourServices advertising _crosscourt._tcp with nothing listening
        # is worse than absent.
        # Superset of every orientation the app can present. OrientationLock
        # narrows per tab at runtime and the web tabs pass `.all`; UIKit
        # intersects it with this list, so upside-down is excluded here
        # rather than in code. Portrait stays because the Matches and Coach
        # webviews are portrait mobile UI — removing it here would break
        # those tabs no matter what OrientationLock does at runtime.
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft,
           UIInterfaceOrientationLandscapeRight]
        # ASC 90474: exempts the (still not-all-orientations) bundle from the
        # iPad multitasking all-orientations requirement.
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Allows the plain-HTTP serverBase override against a LAN Flask
        # instance (Config.swift). Local networking only; ATS still enforces
        # HTTPS for everything else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.crosscourt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SquashLineCallingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SquashLineCalling
