name: SquashLineCalling
options:
  bundleIdPrefix: app.crosscourt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5Q27N692DM
    MARKETING_VERSION: "1.0"
    # Date-based so every day's upload outranks the last; bump the trailing
    # digit for a second same-day TestFlight build.
    CURRENT_PROJECT_VERSION: "202607241"
targets:
  SquashLineCalling:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Model
        optional: true
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Crosscourt
        # xcodegen writes literal "1"s otherwise; route through the build
        # settings so CURRENT_PROJECT_VERSION bumps reach TestFlight.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: Records rallies and runs the live ball tracker.
        NSMicrophoneUsageDescription: Impact sounds help the analyzer find wall hits.
        NSBluetoothAlwaysUsageDescription: Pairs with the second court camera to sync line calls.
        NSLocalNetworkUsageDescription: Finds and pairs with the second court camera on this court.
        NSBonjourServices: [_crosscourt._tcp]
        # Superset of every orientation any tab allows; OrientationLock does
        # the per-tab narrowing at runtime. Portrait stays because the Matches
        # and Coach webviews are portrait mobile UI — a runtime mask can only
        # restrict what this list already permits, never extend it.
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft,
           UIInterfaceOrientationLandscapeRight]
        # ASC 90474: exempts the (still not-all-orientations) bundle from the
        # iPad multitasking all-orientations requirement.
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Allows the plain-HTTP serverBase override against a LAN Flask
        # instance (Config.swift). Local networking only; ATS still enforces
        # HTTPS for everything else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.crosscourt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SquashLineCallingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SquashLineCalling
