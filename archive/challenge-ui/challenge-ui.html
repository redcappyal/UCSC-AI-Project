<!-- ========== 1. The floating Review | Challenge dock (`.callTabs`) ==========
     Lived as the last child of <section id="p-track">, after both panes. It
     shared its whole shell with #navPill (DESIGN.md §8.3) and differed only in
     keeping its text labels. -->

<nav class="callTabs">
  <button type="button" id="tabReview" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
    </svg>
    <span>Review</span>
  </button>
  <button type="button" id="tabChallenge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/>
    </svg>
    <span>Challenge</span>
  </button>
</nav>

<!-- ========== 2. The Challenge pane ==========
     Sat between #reviewTab and the dock above. -->

<div class="callTabPane hidden" id="challengeTab">
  <p class="status" id="corrEmpty">Judge a hit first — then challenge its call here.</p>
  <div class="correctionPanel hidden" id="corrPanel">
    <div class="correctionRow">
      <span class="corrLabel">Type:</span>
      <select id="corrTypeSel">
        <option value="wall_IN">Front wall — In</option>
        <option value="wall_OUT">Front wall — Out</option>
        <option value="side_wall">Side wall</option>
        <option value="floor">Floor</option>
        <option value="racket">Racket</option>
        <option value="none">Not a hit</option>
      </select>
    </div>
    <div class="correctionRow hidden" id="corrFrameRow">
      <span class="corrLabel">Bounce frame:</span>
      <div class="corrSeg">
        <button type="button" id="corrFrameThis">Bounce</button>
        <button type="button" id="corrFrameOther">Not bounce</button>
      </div>
    </div>
    <p class="status hidden" id="corrStatus"></p>
  </div>
</div>

<!-- ========== 3. The CSS that left with it ==========
     `.callTabs` was removed from three shared `#navPill, .callTabs` rules
     (those rules survive in index.html for #navPill alone); the rest below was
     deleted outright. `.callTabPane` itself stays in index.html — #reviewTab is
     still the pane it lays out. -->

<style>
  /* Shared dock shell — .callTabs was one of the two selectors on each rule. */
  #navPill, .callTabs{position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:40; display:flex; gap:2px; padding:7px;
    border-radius:999px; background:var(--nav-bg);
    box-shadow:0 18px 36px rgba(16,17,20,.28)}
  #navPill button, .callTabs button{width:auto; min-height:44px; padding:0 16px; gap:8px;
    border:0; background:transparent; box-shadow:none; color:rgba(255,255,255,.55); font-size:13px}
  #navPill button.active, .callTabs button.active{background:var(--accent-bg); color:var(--accent-text)}
  /* .callTabs' own rule: the dock kept its text labels, so its icons are
     smaller than the icon-only nav pill's 20px. */
  .callTabs svg{width:17px; height:17px; flex:0 0 auto}

  /* Correction panel */
  .correctionPanel{display:flex; flex-direction:column; gap:8px}
  .correctionRow{display:flex; gap:8px; align-items:center}
  .correctionRow .corrLabel{font-size:13px; color:var(--dim); white-space:nowrap; flex:0 0 auto}
  .correctionRow select{flex:1; min-width:0; min-height:44px; padding:8px 12px;
    background:var(--surface); color:var(--text); border:none; border-radius:14px;
    box-shadow:var(--shadow-btn); font:inherit; font-size:15px; font-weight:600}
  .corrSeg{flex:1; display:flex; gap:6px}
  .corrSeg button{flex:1; width:auto; min-height:38px; padding:5px 12px; font-size:12px;
    white-space:nowrap; border:1px solid var(--line); background:transparent; box-shadow:none}
  .corrSeg button.active{background:var(--accent-bg); color:var(--accent-text);
    border-color:transparent; font-weight:700}
</style>
