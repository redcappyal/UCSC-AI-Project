[pytest]
markers =
    requires_model: needs the exported TorchScript ball model and torch (deselect with '-m "not requires_model"')
# archive/ holds the deliberately inert stereo/peer feature (archive/stereo/README.md).
# Its tests are preserved verbatim, still import modules that moved, and must never
# be collected -- not by `pytest tests/`, and not by a bare `pytest` from the root.
norecursedirs = archive .venv .git __pycache__
addopts = -m "not requires_model" --ignore=archive
