[pytest]
markers =
    requires_model: needs the exported TorchScript ball model and torch (deselect with '-m "not requires_model"')
# archive/ holds the deliberately inert features: the stereo/peer path
# (archive/stereo/README.md) and the fusion bounce engine + 3D contact detection
# (archive/fusion-engine/README.md). Their tests are preserved verbatim, still
# import modules that moved, and must never be collected -- not by
# `pytest tests/`, and not by a bare `pytest` from the root.
norecursedirs = archive .venv .git __pycache__
addopts = -m "not requires_model" --ignore=archive
